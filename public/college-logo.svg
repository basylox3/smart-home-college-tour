<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Логотип колледжа</title>
  <desc id="desc">Круглая эмблема колледжа с книгой, огнем и надписью Астана колледж 2000.</desc>
  <defs>
    <linearGradient id="gold" x1="18" y1="12" x2="110" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff4a8" />
      <stop offset="0.32" stop-color="#f3c231" />
      <stop offset="0.72" stop-color="#c77a09" />
      <stop offset="1" stop-color="#fff0a0" />
    </linearGradient>
    <linearGradient id="blue" x1="22" y1="18" x2="105" y2="103" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d7bd7" />
      <stop offset="1" stop-color="#06368f" />
    </linearGradient>
    <linearGradient id="flameRed" x1="48" y1="30" x2="62" y2="87" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ef1f25" />
      <stop offset="1" stop-color="#9d0f19" />
    </linearGradient>
    <linearGradient id="flameGreen" x1="63" y1="28" x2="72" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#23b56e" />
      <stop offset="1" stop-color="#047a46" />
    </linearGradient>
    <linearGradient id="flameBlue" x1="75" y1="33" x2="83" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#166bd3" />
      <stop offset="1" stop-color="#063686" />
    </linearGradient>
    <path id="topArc" d="M 22 70 A 43 43 0 0 1 106 70" />
  </defs>

  <circle cx="64" cy="64" r="62" fill="url(#gold)" />
  <circle cx="64" cy="64" r="58" fill="#fff7d8" />
  <circle cx="64" cy="64" r="51" fill="url(#blue)" />
  <circle cx="64" cy="64" r="42" fill="#f9fbff" />

  <text font-family="Arial, sans-serif" font-size="9.4" font-weight="700" letter-spacing="1.2" fill="#fbe36b">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">АСТАНА КОЛЛЕДЖ</textPath>
  </text>

  <g transform="translate(0 1)">
    <path d="M33 82c10-7 21-9 31 1 10-10 22-8 31-1-10 1-20 4-31 13-10-9-20-12-31-13Z" fill="#f8ffff" stroke="#0973bd" stroke-width="1.6" />
    <path d="M64 82V95" stroke="#0b70b7" stroke-width="1.6" stroke-linecap="round" />
    <path d="M39 83c8 0 16 3 23 9" fill="none" stroke="#78b9df" stroke-width="1.2" />
    <path d="M89 83c-8 0-16 3-23 9" fill="none" stroke="#78b9df" stroke-width="1.2" />
  </g>

  <path d="M56 78c-12-14-6-29 6-47 5 18 3 31-6 47Z" fill="url(#flameRed)" />
  <path d="M66 78c-8-17-4-35 7-52 4 20 4 37-7 52Z" fill="url(#flameGreen)" />
  <path d="M77 79c-7-13-3-27 6-41 5 16 5 29-6 41Z" fill="url(#flameBlue)" />

  <text x="64" y="111" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" letter-spacing="4" fill="#d3312d">2000</text>
  <circle cx="64" cy="64" r="59.5" fill="none" stroke="#7e4e07" stroke-width="1.8" />
  <circle cx="64" cy="64" r="49" fill="none" stroke="#fce26a" stroke-width="2" />
  <circle cx="64" cy="64" r="43" fill="none" stroke="#d4a01a" stroke-width="1" />
